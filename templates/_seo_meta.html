<link rel="canonical" href="{{ request.base_url }}{{ seo_path|default('') }}">
<meta property="og:type" content="{{ seo_type|default('website') }}">
<meta property="og:site_name" content="CronoSolar">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_description }}">
<meta property="og:url" content="{{ request.base_url }}{{ seo_path|default('') }}">
<meta property="og:image" content="{{ request.base_url }}{{ seo_image|default('static/assets/logo.webp') }}">
<meta property="og:locale" content="es_ES">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title }}">
<meta name="twitter:description" content="{{ seo_description }}">
<meta name="twitter:image" content="{{ request.base_url }}{{ seo_image|default('static/assets/logo.webp') }}">
<meta name="robots" content="index, follow">
