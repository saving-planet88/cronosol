<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CronoSolar — Optimiza tu autoconsumo solar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
{% include "_base_styles.html" %}
:root { --r:14px; --amber:#B8860B; --brick:#B23A48; --violet:#6B4FA0; --teal:#0A8F82; }
#topbar{border-bottom:1px solid var(--bdr)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}

/* Cards */
.card{background:var(--cream);border:1px solid var(--bdr);border-radius:var(--r);padding:20px}
.sec-h{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--green);margin-bottom:14px;font-weight:600}

/* Inputs */
label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600}
input,select{width:100%;padding:10px 11px;background:#fff;border:1px solid var(--bdr);border-radius:10px;color:var(--ink);font-family:var(--mono);font-size:13px;outline:none}
input:focus{border-color:var(--green)}
.unit{font-size:10px;color:var(--muted);margin-top:2px}

/* Layout */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}

/* Buttons */
.btn{padding:13px 32px;background:var(--green);color:#fff;border:none;border-radius:999px;font-family:var(--ff);font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-s{padding:7px 13px;background:#fff;border:1px solid var(--bdr);border-radius:999px;color:var(--muted);font-size:11px;cursor:pointer;font-family:var(--ff);font-weight:600}
.btn-s:hover{border-color:var(--green);color:var(--green)}
.btn-find{padding:10px 15px;background:var(--green);border:none;border-radius:10px;color:#fff;font-size:12px;cursor:pointer;font-weight:700;white-space:nowrap}

/* KPI */
.kpi .label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px;font-weight:600}
.kpi .val{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1}
.kpi .det{font-size:11px;color:var(--muted);margin-top:5px}

/* Tags */
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700}

/* Table */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:7px 8px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--bdr);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--bdr);font-family:var(--mono);font-size:11px;white-space:nowrap}
tr:hover td{background:var(--lemon-lite)}

/* Alert cards */
.alert-row{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;background:#fff;border-radius:10px;border:1px solid var(--bdr);margin-bottom:8px}
.alert-time{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;min-width:48px;padding-top:2px}
.alert-msg{font-size:12px;color:var(--muted);line-height:1.4;margin-top:4px}

/* Map */
.map-box{border-radius:12px;overflow:hidden;border:1px solid var(--bdr);height:320px;background:var(--lemon-lite);position:relative}
.map-hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(36,48,26,.82);color:#fff;font-size:10px;padding:3px 10px;border-radius:999px;z-index:999;pointer-events:none}

/* Sources */
.src{font-size:10px;padding:4px 12px;border-radius:999px;font-weight:600;display:inline-block;margin-right:8px;margin-bottom:8px}

/* Status */
.status{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}

@media(max-width:700px){
  .cols{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr}
  .kpi .val{font-size:20px}
}
</style>
</head>
<body>

{% include "_nav.html" %}

<div class="wrap">

  <div class="cols">
    <!-- LEFT: Location -->
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="sec-h">Ubicacion</div>

      <div>
        <label>Codigo postal o localidad</label>
        <div style="display:flex;gap:6px">
          <input type="text" id="cp" placeholder="08401 o Granollers" style="flex:1">
          <button class="btn-find" onclick="geocode()">Buscar</button>
        </div>
        <div id="geo-status" style="font-size:10px;margin-top:4px;min-height:14px"></div>
      </div>

      <div class="g2">
        <div><label>Latitud</label><input type="number" id="lat" value="41.61" step="0.001"></div>
        <div><label>Longitud</label><input type="number" id="lon" value="2.29" step="0.001"></div>
      </div>

      <div id="loc-name" style="font-family:var(--display);font-size:15px;color:var(--green);font-weight:700">Granollers</div>

      <div class="map-box">
        <div id="map" style="width:100%;height:100%"></div>
        <div class="map-hint">Haz click en el mapa para pinear tu ubicacion</div>
      </div>
    </div>

    <!-- RIGHT: Installation -->
    <div class="card" style="display:flex;flex-direction:column">
      <div class="sec-h">Instalacion</div>
      <div class="g2">
        <div><label>Potencia paneles</label><input type="number" id="kwp" value="5" step="0.5" min="0.5"><div class="unit">kWp instalados</div></div>
        <div><label>Bateria</label><input type="number" id="bat" value="10" step="0.5" min="0"><div class="unit">kWh (0 = sin bateria)</div></div>
        <div><label>Consumo diario</label><input type="number" id="cons" value="12" step="0.5" min="1"><div class="unit">kWh/dia medio</div></div>
        <div><label>Fecha</label><input type="date" id="fecha"><div class="unit">Dia a optimizar</div></div>
      </div>

      <div style="margin-top:14px">
        <label style="margin-bottom:8px">Configuracion rapida</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn-s" onclick="preset(3,0,8)">Piso con placas</button>
          <button class="btn-s" onclick="preset(5,10,12)">Casa + bateria</button>
          <button class="btn-s" onclick="preset(8,15,18)">Casa grande</button>
          <button class="btn-s" onclick="preset(15,30,40)">Pyme / Nave</button>
        </div>
      </div>

      <div style="flex:1"></div>
      <button class="btn" id="btn-go" onclick="run()" style="margin-top:16px;align-self:flex-start">Optimizar dia</button>
    </div>
  </div>

  <div id="results" style="display:none"></div>
  <div class="status" id="status-msg">Indica tu ubicacion, configura tu instalacion y pulsa <strong style="color:var(--ink)">Optimizar dia</strong>.</div>

</div>

<script>
{% include "_nav_script.html" %}

// ── Init ──
const tom = new Date(Date.now()+864e5).toISOString().split('T')[0];
document.getElementById('fecha').value = tom;

// ── Prefill desde la URL (enlace de informe compartido por el bot de Telegram / landing) ──
const qp = new URLSearchParams(location.search);
const fromLink = qp.has('lat') && qp.has('lon');
if (fromLink) {
  document.getElementById('lat').value = qp.get('lat');
  document.getElementById('lon').value = qp.get('lon');
  if (qp.has('kwp')) document.getElementById('kwp').value = qp.get('kwp');
  if (qp.has('battery')) document.getElementById('bat').value = qp.get('battery');
  if (qp.has('consumption')) document.getElementById('cons').value = qp.get('consumption');
  if (qp.has('date')) document.getElementById('fecha').value = qp.get('date');
}

// ── Leaflet Map ──
const map = L.map('map',{zoomControl:true}).setView([41.61,2.29],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap',maxZoom:19
}).addTo(map);

let marker = L.marker([41.61,2.29],{draggable:true}).addTo(map);

function setLocation(lat,lon,name,zoom) {
  document.getElementById('lat').value = lat.toFixed(4);
  document.getElementById('lon').value = lon.toFixed(4);
  if(name) document.getElementById('loc-name').textContent = name;
  marker.setLatLng([lat,lon]);
  map.setView([lat,lon],zoom||13);
}

if (fromLink) {
  setLocation(+document.getElementById('lat').value, +document.getElementById('lon').value, 'Tu ubicación', 13);
}

map.on('click',function(e){
  setLocation(e.latlng.lat,e.latlng.lng,'Ubicacion personalizada',map.getZoom());
});

marker.on('dragend',function(){
  const p=marker.getLatLng();
  setLocation(p.lat,p.lng,'Ubicacion personalizada',map.getZoom());
});

// ── Geocode ──
async function geocode() {
  const q = document.getElementById('cp').value.trim();
  if (!q) return;
  const st = document.getElementById('geo-status');
  st.style.color = 'var(--muted)';
  st.textContent = 'Buscando...';
  try {
    const isCP = /^\d{4,5}$/.test(q);
    const url = isCP
      ? `https://nominatim.openstreetmap.org/search?postalcode=${q}&country=Spain&format=json&limit=1&accept-language=es`
      : `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q+', Spain')}&format=json&limit=1&accept-language=es`;
    const r = await fetch(url);
    const d = await r.json();
    if (d.length) {
      const lat=parseFloat(d[0].lat), lon=parseFloat(d[0].lon);
      const name = d[0].display_name.split(',').slice(0,2).join(', ');
      setLocation(lat,lon,name,14);
      st.style.color = 'var(--green)';
      st.textContent = 'Ubicacion encontrada';
    } else {
      st.style.color = '#B45309';
      st.textContent = 'No encontrado. Haz click en el mapa para pinear.';
    }
  } catch(e) {
    st.style.color = '#B45309';
    st.textContent = 'Sin conexion. Haz click en el mapa para pinear.';
  }
}

// Sync manual coord edits to map
document.getElementById('lat').addEventListener('change',function(){
  setLocation(+this.value,+document.getElementById('lon').value,null,map.getZoom());
});
document.getElementById('lon').addEventListener('change',function(){
  setLocation(+document.getElementById('lat').value,+this.value,null,map.getZoom());
});

function preset(kw, b, c) {
  document.getElementById('kwp').value = kw;
  document.getElementById('bat').value = b;
  document.getElementById('cons').value = c;
}

// ── Optimize: llamada real a la API (mismo motor que usa el bot de Telegram) ──
async function fetchPlan(lat,lon,kwp,bat,daily,dateStr) {
  const r = await fetch(`/api/optimize?target_date=${dateStr}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({latitude:lat, longitude:lon, kwp, battery_kwh:bat, daily_consumption_kwh:daily}),
  });
  if(!r.ok) {
    const err = await r.json().catch(()=>({detail:'Error desconocido'}));
    throw new Error(err.detail || `HTTP ${r.status}`);
  }
  return r.json();
}

const ACTION_MAP = {battery_charge:'charge', battery_discharge:'discharge'};

// ── Run ──
async function run() {
  const btn=document.getElementById('btn-go');
  const res=document.getElementById('results');
  const stm=document.getElementById('status-msg');
  btn.disabled=true; btn.textContent='Calculando...';
  stm.style.display='none';

  const lat=+document.getElementById('lat').value;
  const lon=+document.getElementById('lon').value;
  const kwp=+document.getElementById('kwp').value;
  const bat=+document.getElementById('bat').value;
  const daily=+document.getElementById('cons').value;
  const dateStr=document.getElementById('fecha').value;
  const locName=document.getElementById('loc-name').textContent;

  let api;
  try {
    api = await fetchPlan(lat,lon,kwp,bat,daily,dateStr);
  } catch(e) {
    stm.style.display='block';
    stm.textContent = 'No se ha podido calcular el plan: ' + e.message;
    btn.disabled=false; btn.textContent='Optimizar dia';
    return;
  }

  const hours = api.hours.map(h=>({
    hour:h.hour, priceMwh:h.price_eur_mwh, priceKwh:h.price_eur_kwh,
    solar:h.solar_kw, consumption:h.consumption_kw,
    action: ACTION_MAP[h.action] || h.action,
    soc:h.battery_soc_kwh, savings:h.savings_eur,
    exported: h.action==='export' ? Math.max(0, h.solar_kw - h.consumption_kw) : 0,
  }));

  const totalSav = api.total_savings_eur;
  const totalNoOpt = api.total_grid_cost_no_optim_eur;
  const totalSelf = api.total_solar_self_consumed_kwh;
  const totalExp = api.total_exported_kwh;
  const gridCost = api.total_grid_cost_eur;
  const pct=totalNoOpt>0?((totalSav/totalNoOpt)*100).toFixed(0):0;

  const ACT={solar:{l:'Autoconsumo',bg:'#B8860B22',c:'#8A650A'},charge:{l:'Carga bateria',bg:'#157A4E22',c:'#157A4E'},discharge:{l:'Descarga bateria',bg:'#6B4FA0',c:'#fff'},export:{l:'Vertido a red',bg:'#0A8F8222',c:'#0A8F82'},grid:{l:'Compra de red',bg:'#B23A4822',c:'#B23A48'}};
  const AMSG={solar:'Tu produccion solar cubre el consumo. No necesitas hacer nada.',charge:'Excedente solar disponible. Activa la carga de bateria en tu inversor.',discharge:'Precio alto ({p} €/MWh). Descarga bateria para evitar comprar de red.',export:'Bateria llena y excedente solar. Vertiendo a red (~0.06 €/kWh).',grid:'Sin produccion solar. Consumiendo de red a {p} €/MWh.'};
  const AEMOJI={solar:'☀️',charge:'🔋⬆️',discharge:'🔋⬇️',export:'📤',grid:'🔌'};

  // ── Build chart SVG ──
  const W=920,H=250,P=48,PR=56;
  const mK=Math.max(...hours.map(d=>Math.max(d.solar,d.consumption)),.5)*1.15;
  const mP=Math.max(...hours.map(d=>d.priceMwh),1);
  const mS=bat||1;
  const xf=i=>P+(i/23)*(W-P-PR);
  const yK=v=>P+(1-v/mK)*(H-P*2);
  const yP=v=>P+(1-v/mP)*(H-P*2);
  const yS=v=>P+(1-v/mS)*(H-P*2);
  const ln=pts=>pts.map((p,i)=>`${i?'L':'M'}${p[0]},${p[1]}`).join('');
  const sP=hours.map((d,i)=>[xf(i),yK(d.solar)]);
  const cP=hours.map((d,i)=>[xf(i),yK(d.consumption)]);
  const pP=hours.map((d,i)=>[xf(i),yP(d.priceMwh)]);
  const bP=hours.map((d,i)=>[xf(i),yS(d.soc)]);
  const ac={solar:'#B8860B',charge:'#157A4E',discharge:'#6B4FA0',export:'#0A8F82',grid:'#B23A48'};
  const C_SOLAR='#B8860B', C_CONS='#B23A48', C_PRICE='#3E7CC8', C_BAT='#157A4E';

  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  for(let i=0;i<=4;i++){const yy=P+(i/4)*(H-P*2);svg+=`<line x1="${P}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="var(--bdr)" stroke-width=".8"/><text x="${P-6}" y="${yy+4}" fill="#8A9A5F" font-size="9" text-anchor="end" font-family="monospace">${(mK*(1-i/4)).toFixed(1)}</text><text x="${W-PR+6}" y="${yy+4}" fill="${C_PRICE}99" font-size="9" text-anchor="start" font-family="monospace">${(mP*(1-i/4)).toFixed(0)}</text>`;}
  for(let i=0;i<24;i+=3)svg+=`<text x="${xf(i)}" y="${H-6}" fill="#8A9A5F" font-size="9" text-anchor="middle" font-family="monospace">${String(i).padStart(2,'0')}h</text>`;
  svg+=`<text x="${P-6}" y="${P-12}" fill="#8A9A5F" font-size="8" text-anchor="end">kW</text>`;
  svg+=`<text x="${W-PR+6}" y="${P-12}" fill="${C_PRICE}99" font-size="8" text-anchor="start">€/MWh</text>`;
  svg+=`<path d="${ln(sP)}L${xf(23)},${yK(0)}L${xf(0)},${yK(0)}Z" fill="${C_SOLAR}14"/>`;
  svg+=`<path d="${ln(pP)}" fill="none" stroke="${C_PRICE}80" stroke-width="1.5" stroke-dasharray="4,3"/>`;
  svg+=`<path d="${ln(sP)}" fill="none" stroke="${C_SOLAR}" stroke-width="2.5"/>`;
  svg+=`<path d="${ln(cP)}" fill="none" stroke="${C_CONS}" stroke-width="2"/>`;
  if(bat>0)svg+=`<path d="${ln(bP)}" fill="none" stroke="${C_BAT}" stroke-width="1.5" stroke-dasharray="6,3"/>`;
  hours.forEach((d,i)=>svg+=`<circle cx="${xf(i)}" cy="${yK(d.solar)}" r="3" fill="${ac[d.action]||'#8A9A5F'}" opacity=".9"/>`);
  svg+=`</svg>`;

  // ── Alerts ──
  const alerts=hours.filter((h,i,a)=>i===0||h.action!==a[i-1].action);
  let alertsHtml=alerts.map(h=>{
    const a=ACT[h.action];
    const msg=AMSG[h.action].replace('{p}',h.priceMwh.toFixed(0));
    return`<div class="alert-row"><div class="alert-time">${String(h.hour).padStart(2,'0')}:00</div><div><span class="tag" style="background:${a.bg};color:${a.c};margin-bottom:4px">${AEMOJI[h.action]} ${a.l}</span><div class="alert-msg">${msg}</div></div></div>`;
  }).join('');

  // ── Table ──
  let tbl=`<table><thead><tr><th>Hora</th><th>Precio</th><th>Solar</th><th>Consumo</th><th>Accion</th><th>Bateria</th><th>Ahorro</th></tr></thead><tbody>`;
  hours.forEach(h=>{const a=ACT[h.action];tbl+=`<tr><td>${String(h.hour).padStart(2,'0')}:00</td><td>${h.priceMwh.toFixed(1)}</td><td style="color:${C_SOLAR}">${h.solar.toFixed(2)}</td><td>${h.consumption.toFixed(2)}</td><td><span class="tag" style="background:${a.bg};color:${a.c}">${a.l}</span></td><td style="color:${C_BAT}">${h.soc.toFixed(1)}</td><td style="color:${h.savings>0?'var(--green)':'var(--muted)'}">${h.savings.toFixed(3)} €</td></tr>`;});
  tbl+=`</tbody></table>`;

  // ── Render all ──
  res.innerHTML=`
    <div style="margin-bottom:16px">
      <span class="src" style="color:var(--green);background:#157A4E1a">☀️ Solar: Open-Meteo (datos reales)</span>
      <span class="src" style="color:var(--green);background:#157A4E1a">💶 Precios: ESIOS/REE (datos reales)</span>
    </div>

    <div class="g4">
      <div class="card kpi"><div class="label">Ahorro estimado</div><div class="val" style="color:var(--green)">${totalSav.toFixed(2)} €</div><div class="det">${pct}% menos vs. sin solar</div></div>
      <div class="card kpi"><div class="label">Autoconsumo solar</div><div class="val" style="color:${C_SOLAR}">${totalSelf.toFixed(1)} kWh</div><div class="det">Directamente del sol</div></div>
      <div class="card kpi"><div class="label">Coste red</div><div class="val" style="color:${C_CONS}">${gridCost.toFixed(2)} €</div><div class="det">vs. ${totalNoOpt.toFixed(2)} € sin solar</div></div>
      <div class="card kpi"><div class="label">Excedente vertido</div><div class="val" style="color:${C_PRICE}">${totalExp.toFixed(1)} kWh</div><div class="det">~${(totalExp*.06).toFixed(2)} € compensacion</div></div>
    </div>

    <div class="card" style="margin-bottom:20px">
      <div class="sec-h">Curvas — ${locName} — ${dateStr}</div>
      ${svg}
      <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:12px">
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)"><div style="width:9px;height:9px;border-radius:50%;background:${C_SOLAR}"></div>Produccion solar</div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)"><div style="width:9px;height:9px;border-radius:50%;background:${C_CONS}"></div>Consumo</div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)"><div style="width:9px;height:9px;border-radius:50%;background:${C_PRICE}"></div>Precio pool</div>
        ${bat>0?`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)"><div style="width:9px;height:9px;border-radius:50%;background:${C_BAT}"></div>Bateria SOC</div>`:''}
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;border-color:#B8860B55">
      <div class="sec-h"><span style="color:${C_SOLAR}">Fase 1.5</span> — Alertas Telegram que recibirias</div>
      ${alertsHtml}
      <div style="margin-top:14px;padding:10px 14px;background:var(--lemon-lite);border-radius:10px;font-size:12px;color:var(--muted);line-height:1.5">
        Por Telegram recibes <strong style="color:var(--ink)">un mensaje cada tarde (~16:00)</strong> con el plan de <strong style="color:var(--ink)">mañana</strong> — lo programas en tu inversor esa noche y te olvidas, nada de avisos cada hora. Pruébalo: <a href="https://t.me/Cronosolar_bot" target="_blank" style="color:var(--green);font-weight:600">@Cronosolar_bot</a>.
      </div>
      <div style="margin-top:8px;padding:10px 14px;background:var(--lemon-lite);border-radius:10px;font-size:12px;color:var(--muted);line-height:1.5">
        🔌 ¿Tu inversor no permite programar franjas horarias? Activa <code style="background:#fff;border:1px solid var(--bdr);border-radius:6px;padding:1px 6px">/avisos on</code> en el bot para que te avise en tiempo real cada vez que toque cambiar de acción.
      </div>
      <div style="margin-top:8px;padding:10px 14px;background:var(--lemon-lite);border-radius:10px;font-size:12px;color:var(--muted);line-height:1.5">
        🔧 ¿No sabes cómo programar las franjas horarias en tu inversor? <a href="/tutoriales" style="color:var(--green);font-weight:600">Guías paso a paso por marca →</a>
      </div>
    </div>

    <div class="card" style="overflow-x:auto">
      <div class="sec-h">Plan horario completo</div>
      ${tbl}
    </div>
  `;
  res.style.display='block';
  btn.disabled=false; btn.textContent='Optimizar dia';
}

// Si llegamos desde el enlace del bot de Telegram, calcula automaticamente
if (fromLink) run();
</script>
</body>
</html>
