<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ post.title }} — Blog CronoSolar</title>
<meta name="description" content="{{ post.excerpt }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
{% include "_base_styles.html" %}
a:hover{color:var(--green)}
#topbar{border-bottom:1px solid var(--bdr)}
.wrap{max-width:760px;margin:0 auto;padding:0 26px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--green);font-weight:600;margin-bottom:16px}
.meta{font-size:13.5px;color:var(--muted);margin-bottom:26px}
h1{font-size:clamp(28px,4.4vw,44px);font-weight:800;letter-spacing:-1.2px;line-height:1.1;margin-bottom:26px}
h2{font-size:clamp(20px,2.6vw,26px);font-weight:800;letter-spacing:-.6px;margin:40px 0 14px}
p{font-size:16px;line-height:1.75;color:var(--ink)}
p+p{margin-top:14px}
.lead{font-size:18px;color:var(--muted);line-height:1.65}
.box{background:var(--lemon-lite);border:1px solid var(--bdr);border-radius:16px;padding:24px 26px}
.box p{margin:0}
.src{font-size:12.5px;color:var(--muted);margin-top:36px;padding-top:20px;border-top:1px solid var(--bdr)}
.src a{color:var(--green);font-weight:600}
.back{display:inline-block;margin-bottom:20px;font-size:13.5px;font-weight:600;color:var(--muted)}
</style>
</head>
<body>

{% include "_nav.html" %}

<div class="wrap" style="padding:60px 0 80px">
  <a class="back" href="/blog">← Blog</a>
  <div class="eyebrow">{{ post.tag }}</div>
  <h1>{{ post.title }}</h1>
  <div class="meta">{{ post.date }} · {{ post.read_time }} de lectura</div>
  {% include "blog/" ~ post.slug ~ ".html" %}
</div>

{% include "_footer.html" %}

</body>
</html>
